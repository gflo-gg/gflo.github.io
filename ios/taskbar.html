<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFLO — Taskbar</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --red:        #CC0000;
    --red-bright: #FF2020;
    --red-dim:    #880000;
    --red-glow:   rgba(255,32,32,0.45);
    --green:      #00FF88;
    --green-dim:  #00AA55;
    --gold:       #FFB800;
    --white:      #F0F0F0;
    --text:       #AAAAAA;
    --text-dim:   #444444;
    --bar-h:      30px;
    --bg:         rgba(8,0,0,0.78);
    --border:     rgba(204,0,0,0.35);
  }

  html, body {
    width: 1920px;
    height: 30px;
    overflow: hidden;
    background: transparent;
    font-family: 'Share Tech Mono', monospace;
  }

  /* ── TASKBAR ── */
  .taskbar {
    width: 1920px;
    height: 30px;
    background: var(--bg);
    backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* scanline overlay */
  .taskbar::before {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:20;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 3px
    );
  }

  /* top glow line */
  .taskbar::after {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--red-dim) 15%,
      var(--red-bright) 50%,
      var(--red-dim) 85%,
      transparent 100%
    );
    box-shadow: 0 0 8px var(--red-glow);
    animation: topGlow 4s ease-in-out infinite;
  }

  /* ══════════════════════════════════════
     LEFT — START BUTTON
  ══════════════════════════════════════ */
  .start-btn {
    height: 30px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-right: 1px solid var(--border);
    background: rgba(204,0,0,0.08);
    cursor: default;
    flex-shrink: 0;
    transition: background 0.15s;
    position: relative;
    z-index: 2;
  }

  .start-btn:hover { background: rgba(204,0,0,0.18); }

  .start-logo {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--red-bright);
    text-shadow: 0 0 10px var(--red-glow), 0 0 20px rgba(204,0,0,0.3);
    letter-spacing: 1px;
    line-height: 1;
    animation: logoFlicker 7s infinite;
  }

  .start-label {
    font-size: 10px;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── SEPARATOR ── */
  .sep {
    width: 1px;
    height: 22px;
    background: var(--border);
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* ══════════════════════════════════════
     LEFT — PINNED APPS / ACTIVE WINDOW
  ══════════════════════════════════════ */
  .pinned-area {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px;
    height: 30px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
  }

  .app-btn {
    height: 22px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid transparent;
    background: transparent;
    cursor: default;
    transition: all 0.15s;
    position: relative;
  }

  .app-btn.active {
    background: rgba(204,0,0,0.1);
    border-color: rgba(204,0,0,0.25);
  }

  /* active underline */
  .app-btn.active::after {
    content:'';
    position:absolute; bottom:-1px; left:10%; right:10%; height:2px;
    background: var(--red-bright);
    box-shadow: 0 0 6px var(--red-glow);
  }

  .app-icon {
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: var(--red-bright);
    line-height: 1;
  }

  .app-label {
    font-size: 9px;
    color: var(--text);
    letter-spacing: 1px;
    white-space: nowrap;
  }

  /* ══════════════════════════════════════
     CENTER — spacer
  ══════════════════════════════════════ */
  .center-spacer { flex: 1; }

  /* ══════════════════════════════════════
     RIGHT — SYSTEM TRAY
  ══════════════════════════════════════ */
  .tray {
    display: flex;
    align-items: center;
    height: 30px;
    border-left: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* ── TRAY ITEM base ── */
  .tray-item {
    height: 30px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    border-right: 1px solid rgba(204,0,0,0.12);
    flex-shrink: 0;
    cursor: default;
    transition: background 0.15s;
    position: relative;
  }

  .tray-item:hover { background: rgba(204,0,0,0.08); }
  .tray-item:last-child { border-right: none; }

  /* ── RECENT EVENT FLASH ── */
  .tray-event {
    min-width: 180px;
    max-width: 220px;
    overflow: hidden;
  }

  .event-inner {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .event-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red-bright);
    box-shadow: 0 0 6px var(--red-glow);
    flex-shrink: 0;
    animation: dotBlink 1.5s ease-in-out infinite;
  }

  .event-text {
    font-size: 9px;
    color: #888;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
  }

  .event-text .ev-type  { color: var(--red-bright); text-shadow: 0 0 6px var(--red-glow); letter-spacing: 2px; }
  .event-text .ev-user  {
    color: var(--white);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 0 4px;
    font-size: 9px;
  }

  /* flash animation on new event */
  .tray-event.flash .event-text {
    animation: eventFlash 0.4s steps(1) 3;
  }

  /* ── NOW PLAYING ── */
  .tray-music {
    min-width: 160px;
    max-width: 200px;
    overflow: hidden;
  }

  .music-inner {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .music-icon {
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: var(--red-dim);
    flex-shrink: 0;
    animation: musicPulse 1.2s ease-in-out infinite;
  }

  .music-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    overflow: hidden;
  }

  .music-label {
    font-size: 7px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .music-track {
    font-size: 9px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 155px;
  }

  /* ── SIGNAL BARS ── */
  .tray-signal { gap: 3px; }

  .signal-label {
    font-size: 7px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-right: 2px;
  }

  .signal-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }

  .bar {
    width: 4px;
    background: var(--red-dim);
    border-radius: 1px;
    transition: background 0.3s;
  }

  .bar.b1 { height: 4px;  }
  .bar.b2 { height: 7px;  }
  .bar.b3 { height: 10px; }
  .bar.b4 { height: 13px; }

  .bar.active { background: var(--red-bright); box-shadow: 0 0 4px var(--red-glow); }
  .bar.dim    { background: #2a2a2a; }

  /* ── LIVE PILL ── */
  .tray-live { gap: 6px; }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(204,0,0,0.12);
    border: 1px solid rgba(204,0,0,0.35);
    padding: 2px 8px;
  }

  .live-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red-bright);
    box-shadow: 0 0 8px var(--red-glow);
    animation: livePulse 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }

  .live-text {
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--red-bright);
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 0 8px var(--red-glow);
  }

  /* ── UPTIME ── */
  .tray-uptime { gap: 5px; }

  .uptime-inner {
    display: flex;
    flex-direction: column;
    gap: 1px;
    align-items: flex-end;
  }

  .uptime-label {
    font-size: 7px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .uptime-value {
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--text);
    letter-spacing: 1px;
    line-height: 1;
  }

  /* ── VIEWER COUNT ── */
  .tray-viewers { gap: 5px; }

  .viewer-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red-bright);
    box-shadow: 0 0 8px var(--red-glow);
    flex-shrink: 0;
    animation: livePulse 1.8s ease-in-out infinite;
  }

  .viewer-count {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--white);
    letter-spacing: 1px;
    line-height: 1;
    min-width: 32px;
    text-align: left;
  }

  /* ── CLOCK ── */
  .tray-clock {
    min-width: 72px;
    border-right: none;
    gap: 0;
  }

  .clock-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .clock-time {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--white);
    letter-spacing: 1px;
    line-height: 1;
  }

  .clock-date {
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* ══════════════════════════════════════
     ANIMATIONS
  ══════════════════════════════════════ */
  @keyframes topGlow {
    0%,100% { opacity:0.6; }
    50%      { opacity:1; }
  }

  @keyframes logoFlicker {
    0%,92%,100% { opacity:1; text-shadow:0 0 10px var(--red-glow),0 0 20px rgba(204,0,0,0.3); }
    93% { opacity:0.4; }
    94% { opacity:1; }
    97% { opacity:0.6; text-shadow:none; }
    98% { opacity:1; }
  }

  @keyframes dotBlink {
    0%,100% { opacity:1; }
    50%      { opacity:0.3; }
  }

  @keyframes livePulse {
    0%,100% { box-shadow:0 0 6px var(--red-glow); opacity:1; }
    50%      { box-shadow:0 0 14px var(--red-glow); opacity:0.7; }
  }

  @keyframes musicPulse {
    0%,100% { opacity:1;   color:var(--red-dim); }
    50%      { opacity:0.6; color:var(--red-bright); }
  }

  @keyframes eventFlash {
    0%,100% { opacity:1; }
    50%      { opacity:0; }
  }

  @keyframes signalCycle {
    0%,100% { opacity:1; }
    50%      { opacity:0.5; }
  }

</style>
</head>
<body>

<div class="taskbar">

  <!-- ══ START BUTTON ══ -->
  <div class="start-btn">
    <div class="start-logo">G:\&gt;</div>
    <div class="start-label">GFLO</div>
  </div>

  <!-- ══ PINNED APPS ══ -->
  <div class="pinned-area">
    <div class="app-btn active">
      <div class="app-icon">▶</div>
      <div class="app-label" id="activeApp">stream_active.exe</div>
    </div>
    <div class="app-btn">
      <div class="app-icon">⚙</div>
      <div class="app-label">sys_monitor.exe</div>
    </div>
    <div class="app-btn">
      <div class="app-icon">⚡</div>
      <div class="app-label">chat_stream.exe</div>
    </div>
  </div>

  <!-- ══ CENTER SPACER ══ -->
  <div class="center-spacer"></div>

  <!-- ══ SYSTEM TRAY ══ -->
  <div class="tray">

    <!-- Recent Event Flash -->
    <div class="tray-item tray-event" id="trayEvent">
      <div class="event-inner">
        <div class="event-dot"></div>
        <div class="event-text" id="eventText">
          <span class="ev-type">STANDBY</span> — awaiting events
        </div>
      </div>
    </div>

    <div class="sep"></div>

    <!-- Now Playing -->
    <div class="tray-item tray-music">
      <div class="music-inner">
        <div class="music-icon">♪</div>
        <div class="music-text">
          <div class="music-label">NOW PLAYING</div>
          <div class="music-track" id="musicTrack">Perturbator — Humans Are Such Easy Prey</div>
        </div>
      </div>
    </div>

    <div class="sep"></div>

    <!-- Signal Bars -->
    <div class="tray-item tray-signal">
      <div class="signal-label">SIG</div>
      <div class="signal-bars">
        <div class="bar b1 active" id="sig1"></div>
        <div class="bar b2 active" id="sig2"></div>
        <div class="bar b3 active" id="sig3"></div>
        <div class="bar b4 active" id="sig4"></div>
      </div>
    </div>

    <div class="sep"></div>

    <!-- LIVE Pill -->
    <div class="tray-item tray-live">
      <div class="live-pill">
        <div class="live-dot"></div>
        <div class="live-text">LIVE</div>
      </div>
    </div>

    <div class="sep"></div>

    <!-- Uptime -->
    <div class="tray-item tray-uptime">
      <div class="uptime-inner">
        <div class="uptime-label">RUNTIME</div>
        <div class="uptime-value" id="uptimeVal">00:00:00</div>
      </div>
    </div>

    <div class="sep"></div>

    <!-- Viewer Count -->
    <div class="tray-item tray-viewers">
      <div class="viewer-dot"></div>
      <div class="viewer-count" id="viewerCount">247</div>
    </div>

    <div class="sep"></div>

    <!-- Clock -->
    <div class="tray-item tray-clock">
      <div class="clock-inner">
        <div class="clock-time" id="clockTime">00:00</div>
        <div class="clock-date" id="clockDate">MON 00/00</div>
      </div>
    </div>

  </div><!-- /tray -->
</div><!-- /taskbar -->

<script>
  /* ── CLOCK ── */
  function updateClock() {
    const now = new Date();
    const h  = String(now.getHours()).padStart(2,'0');
    const m  = String(now.getMinutes()).padStart(2,'0');
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const day  = days[now.getDay()];
    const mo   = String(now.getMonth()+1).padStart(2,'0');
    const d    = String(now.getDate()).padStart(2,'0');
    document.getElementById('clockTime').textContent = `${h}:${m}`;
    document.getElementById('clockDate').textContent = `${day} ${mo}/${d}`;
  }
  updateClock();
  setInterval(updateClock, 10000);

  /* ── UPTIME ── */
  const startTime = Date.now();
  function updateUptime() {
    const s   = Math.floor((Date.now() - startTime) / 1000);
    const hh  = String(Math.floor(s / 3600)).padStart(2,'0');
    const mm  = String(Math.floor((s % 3600) / 60)).padStart(2,'0');
    const ss  = String(s % 60).padStart(2,'0');
    document.getElementById('uptimeVal').textContent = `${hh}:${mm}:${ss}`;
  }
  updateUptime();
  setInterval(updateUptime, 1000);

  /* ── SIGNAL BARS — subtle random fluctuation ── */
  const bars = ['sig1','sig2','sig3','sig4'];
  function fluctuateSignal() {
    const strength = Math.random() > 0.15 ? 4 : Math.random() > 0.5 ? 3 : 2;
    bars.forEach((id, i) => {
      const el = document.getElementById(id);
      el.className = `bar b${i+1} ${i < strength ? 'active' : 'dim'}`;
    });
  }
  setInterval(fluctuateSignal, 4000 + Math.random() * 3000);

  /* ── RECENT EVENTS ── */
  const events = [
    { type:'FOLLOW',  user:'xX_D4RKN0D3_Xx'  },
    { type:'SUB',     user:'GhostPacket99'     },
    { type:'RAID',    user:'ShadowExec'        },
    { type:'BITS',    user:'VoidPacket_99'     },
    { type:'FOLLOW',  user:'netrunner42'       },
    { type:'SUB',     user:'PhantomTMP'        },
    { type:'FOLLOW',  user:'malloc_void'       },
    { type:'RAID',    user:'dark_bat_'         },
  ];

  let evIdx = 0;

  function flashEvent(ev) {
    const el   = document.getElementById('trayEvent');
    const text = document.getElementById('eventText');
    text.innerHTML = `<span class="ev-type">${ev.type}</span> &nbsp;<span class="ev-user">${ev.user}</span>`;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1200);
  }

  function cycleEvents() {
    flashEvent(events[evIdx % events.length]);
    evIdx++;
    setTimeout(cycleEvents, 5000 + Math.random() * 4000);
  }
  setTimeout(cycleEvents, 3000);

  /* ── NOW PLAYING — cycle tracks ── */
  const tracks = [
    'Perturbator — Humans Are Such Easy Prey',
    'Carpenter Brut — Turbo Killer',
    'Gunship — Tech Noir',
    'Dan Terminus — The Wrath of Code',
    'Kavinsky — Nightcall',
    'Makeup and Vanity Set — Ghosts',
  ];
  let trackIdx = 0;

  function cycleTrack() {
    trackIdx = (trackIdx + 1) % tracks.length;
    const el = document.getElementById('musicTrack');
    el.style.opacity = '0';
    setTimeout(() => {
      el.textContent = tracks[trackIdx];
      el.style.transition = 'opacity 0.5s';
      el.style.opacity = '1';
    }, 300);
  }
  setInterval(cycleTrack, 18000);

  /* ── VIEWER COUNT — subtle drift ── */
  let viewers = 247;
  function driftViewers() {
    const delta = Math.floor(Math.random() * 5) - 2;
    viewers = Math.max(1, viewers + delta);
    document.getElementById('viewerCount').textContent = viewers;
  }
  setInterval(driftViewers, 8000 + Math.random() * 5000);
</script>

</body>
</html>
